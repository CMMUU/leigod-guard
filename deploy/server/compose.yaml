name: leigod-guard
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Run init-config.py first}
      MYSQL_USER: guard
      MYSQL_DATABASE: leigod_guard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run init-config.py first}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  app:
    image: ${GUARD_IMAGE:-leigod-guard-server:local}
    build:
      context: ../../server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${GUARD_ENV_FILE:-./server.env}
    environment:
      DATABASE_URL: mysql://guard:${MYSQL_PASSWORD:?Run init-config.py first}@mysql:3306/leigod_guard
      MYSQL_COMPOSE_NETWORK: 'true'
      LISTEN_ADDRESS: 0.0.0.0
      PORT: '3088'
      STATIC_DIR: /app/static
      REMOTE_KEY_FILE: /run/secrets/remote.key
    ports:
      - '127.0.0.1:${APP_PORT:-3088}:3088'
    volumes:
      - type: bind
        source: ${GUARD_SECRET_FILE:-./secrets/remote.key}
        target: /run/secrets/remote.key
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set your HTTPS domain in server.env}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  mysql-data:
  caddy-data:
  caddy-config:
