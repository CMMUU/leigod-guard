name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check installer compiler
        run: ./scripts/installer.ps1 -CheckCompilerOnly
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = (rustc --version) -replace '[^A-Za-z0-9.-]', '-'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'src/**') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Fetch locked dependencies
        run: cargo fetch --locked --target $env:RUST_TARGET
      - name: Run offline unit tests
        run: cargo test --locked --offline --target $env:RUST_TARGET
      - name: Build release executable
        run: cargo build --release --locked --offline --target $env:RUST_TARGET
      - name: Save verified Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build Windows installer and portable package
        run: ./scripts/installer.ps1 -Target $env:RUST_TARGET -OutputDirectory dist -SkipBuild
      - name: Test silent installation, upgrade, and uninstall
        run: ./scripts/test-installer.ps1 -OutputDirectory dist
      - name: Upload verified Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            dist/leigod-guard-*-windows-x64-setup.exe
            dist/leigod-guard-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-test-logs-${{ github.sha }}
          path: dist/installer-test-logs/
          if-no-files-found: ignore
          retention-days: 7
