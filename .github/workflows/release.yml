name: Publish Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v0.9.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_TARGET: x86_64-pc-windows-msvc
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Expected a stable major.minor.patch version tag beginning with v.'
          }
      - name: Check out the exact release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Check installer compiler
        run: ./scripts/installer.ps1 -CheckCompilerOnly
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = (rustc --version) -replace '[^A-Za-z0-9.-]', '-'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'build.rs', 'src/**', 'examples/**', 'assets/**') }}
          restore-keys: |
            windows-msvc-${{ steps.rust.outputs.compiler }}-
      - name: Verify shared brand assets
        run: python scripts/generate-brand.py --check
      - name: Check package version against tag
        run: |
          $metadataText = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata.' }
          $metadata = ($metadataText -join "`n") | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'leigod-guard' })
          if ($packages.Count -ne 1) { throw 'Expected exactly one leigod-guard package.' }
          $version = $packages[0].version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match Cargo version $version."
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test Gitee release synchronizer offline
        run: python -m unittest discover -s scripts -p test_sync_gitee.py
      - name: Fetch locked dependencies
        run: cargo fetch --locked --target $env:RUST_TARGET
      - name: Run offline unit tests
        run: cargo test --locked --offline --target $env:RUST_TARGET
      - name: Verify silent and manual startup with actual eframe
        run: ./scripts/test-silent-start.ps1 -Target $env:RUST_TARGET
      - name: Verify normal session end on isolated eframe windows
        run: ./scripts/test-session-end.ps1 -Target $env:RUST_TARGET
      - name: Render native UI with the DirectX software adapter
        id: native-ui
        if: ${{ !cancelled() }}
        env:
          LEIGOD_UI_PREVIEW_DIR: target/ui-preview
        run: cargo test --locked --offline --target $env:RUST_TARGET ui::presentation_tests::render_apple_preview -- --ignored --nocapture
      - name: Upload native UI previews
        if: ${{ !cancelled() && steps.native-ui.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ui-${{ github.ref_name }}
          path: target/ui-preview/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Build release executable
        run: cargo build --release --locked --offline --target $env:RUST_TARGET
      - name: Save verified Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build Windows installer and portable package
        run: ./scripts/installer.ps1 -Target $env:RUST_TARGET -OutputDirectory dist -SkipBuild
      - name: Verify executable and installer icon resources
        run: ./scripts/test-icons.ps1 -Target $env:RUST_TARGET -OutputDirectory dist
      - name: Test silent installation, upgrade, and uninstall
        run: ./scripts/test-installer.ps1 -OutputDirectory dist
      - name: Test installed and portable application updates
        run: ./scripts/test-updater.ps1 -OutputDirectory dist
      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-test-logs-${{ github.ref_name }}
          path: dist/installer-test-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload updater test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-test-logs-${{ github.ref_name }}
          path: dist/updater-test-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare release notes
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $pattern = '(?ms)^##\s+\[?v?' + [regex]::Escape($version) + '\]?(?=\s|$)[^\r\n]*\r?\n(.*?)(?=^##\s|\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success) { throw "Missing CHANGELOG entry for $version." }
          $notes = @"
          **推荐下载安装版：``leigod-guard-$env:RELEASE_TAG-windows-x64-setup.exe``。** 双击后按安装向导操作，完成后可从桌面或开始菜单打开。

          **本版接入香港云平台，并新增首页云端自动暂停入口。** 登录、设备配对、心跳及授权请求统一使用 [云平台](https://leigod-login.cmmuu.com)。原账号会话期限与设备身份保留；后台 0.7.0 / MySQL 已先行迁移。云端仍为临时测试，远程保护需明确授权，状态须等待服务器确认。下载中心继续为默认来源，官网下载固定地址不变。

          适用于 Windows 10 / 11 x64。安装程序自动检查 Microsoft WebView2 Runtime；缺少时调用包内的微软官方安装器联网补齐。已有运行库时直接安装应用。选择加速器、登录对应账号并添加需要监控的游戏；外星仔还需完成官方暂停状态校准。安装版和便携版均为独立第三方工具，与雷神、外星仔官方无隶属或背书关系。

          需要绿色免安装版时，下载 ``leigod-guard-$env:RELEASE_TAG-windows-x64.zip``，完整解压后打开 ``leigod-guard.exe``。每次发版同时提供安装版和绿色版；``SHA256SUMS.txt`` 包含两个包的 SHA-256 校验值。程序尚未代码签名，Windows 可能提示未知发布者。

          “关于与更新”默认使用“下载中心（推荐）”。新配置、缺少来源及旧 auto 迁移至下载中心；手动 Gitee/GitHub 选择保留。下载中心发布完整三文件后可发现新版，失败请重试或手动换源。也可手动选择“自动选择（Gitee/GitHub）”，同版本优先 Gitee，失败仅尝试同版本、同大小和同校验值的备用文件。启动检查默认关闭，须点击后才下载安装。安装版和绿色版各自保持使用方式并保留配置。旧版首次升级可使用官网下载固定入口或当前支持的 Gitee/GitHub。

          GitHub 构建一次；配置发布凭据后由自动同步任务把同一份说明和成品复制到 [Gitee 发布页](https://gitee.com/cmmuu/leigod-guard/releases)，维护者还需将三个相同文件发布到 [下载中心](https://downloads.cmmuu.com/) 并核对。同步完成前各来源可能暂时不同；不能把 GitHub 发布成功等同于下载中心已经上架。官网固定入口：[安装版](https://leigod.cmmuu.com/download/installer)、[绿色版](https://leigod.cmmuu.com/download/portable)。

          原启动补查默认 180 秒、正常退出宽限期默认 90 秒，均保留已有用户配置。PUBG 新启动链会撤销旧倒计时，进入单轮有限保护；自动保护到期仍无主进程时，从有效观察开始重新等待完整退出宽限期再复查。首页或托盘的“准备游戏，保护10分钟”也适用于检查结束后的新一轮启动或重启，重复点击从最后一次点击计时。程序不能识别官方客户端的加速按钮。更新期间本机监控短暂中断，重启后先确认已绑定设备的云端选择，再执行当前对象的启动策略；旧配置缺少启动链保护字段时采用 600 秒。自动启动保护不改变服务器心跳、失联阈值或网吧模式；只有显式手动准备会携带原有准备期。进程或网络失败不视为暂停成功，已经消耗的时长无法追回。

          **如何确认暂停生效：** 等待工具完成暂停后，打开雷神官方微信小程序，登录与本工具相同的雷神账号，下拉刷新，查看计时是否已暂停。核对时先只刷新查看，不要先手动点击暂停；本地暂停的成功提示来自暂停接口返回；服务器失联保护还会查询确认。最终仍可用小程序刷新后的账户计时状态核对。这里核对的是暂停计时，本工具没有停止客户端加速的功能。

          游戏加加屏蔽默认关闭；已开启时继续使用仅保护本工具的 Windows 严格 DLL 加载策略，也可能影响其他 OSD、录屏或输入法插件。已有验证为 GamePP SDK 1.2.1615.625 与 NVIDIA 环境，不扩大为所有显卡兼容承诺。

          本工作流在 Windows Server 2022 上构建 ``$env:RUST_TARGET``，已通过代码格式、离线单元测试、release 编译、静态 CRT 依赖检查、EXE / 安装器 / 绿色包图标资源校验，以及静默安装、快捷方式、版本号、覆盖升级、卸载和配置保留检查。更新集成测试使用无账号操作的下一版本测试程序，验证真实更新辅助进程的等待退出、安装版升级、绿色版替换、配置保留和重新启动。原生界面通过独立状态的指针交互、窄窗口布局和 DirectX 软件渲染截图检查；本次发行测试未验证真实雷神或外星仔账户登录、验证码、实际暂停请求、真实系统关机或所有硬件显卡组合；平台账号联调范围见本版变化说明。使用方法、触发条件及限制见仓库 README。

          **服务器失联保护默认关闭。** 更新后在“平台账号 → 服务器失联保护”明确授权并开启，等待服务器确认生效。全部受保护设备失联超过 120 秒且准备期结束后，云端后台才尝试暂停；任一受保护设备在线都会阻止失联暂停。关闭、退出及断网时的确认边界见 ``docs/REMOTE_PROTECTION.md``。CI 使用模拟雷神与外星仔接口验证故障处理；真实账号授权与暂停的验收范围见本版变化及项目文档。

          $($section.Groups[1].Value.Trim())
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/release-notes.md'), $notes, [System.Text.UTF8Encoding]::new($false))
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $zip = Join-Path $PWD "dist/leigod-guard-$env:RELEASE_TAG-windows-x64.zip"
          $setup = Join-Path $PWD "dist/leigod-guard-$env:RELEASE_TAG-windows-x64-setup.exe"
          $sums = Join-Path $PWD 'dist/SHA256SUMS.txt'
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG, $setup, $zip, $sums,
            '--verify-tag', '--draft', '--title', "Accelerator Guard $env:RELEASE_TAG",
            '--notes-file', 'dist/release-notes.md'
          )
          # An existing release causes this to fail instead of silently replacing assets.
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. Inspect any existing release before retrying.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Assets uploaded, but publishing failed. The release remains a draft.' }
