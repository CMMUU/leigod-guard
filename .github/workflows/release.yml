name: Publish Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag, for example v0.7.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_TARGET: x86_64-pc-windows-msvc
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Expected a stable major.minor.patch version tag beginning with v.'
          }
      - name: Check out the exact release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Check installer compiler
        run: ./scripts/installer.ps1 -CheckCompilerOnly
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = (rustc --version) -replace '[^A-Za-z0-9.-]', '-'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'src/**') }}
          restore-keys: |
            windows-msvc-${{ steps.rust.outputs.compiler }}-
      - name: Check package version against tag
        run: |
          $metadataText = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata.' }
          $metadata = ($metadataText -join "`n") | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'leigod-guard' })
          if ($packages.Count -ne 1) { throw 'Expected exactly one leigod-guard package.' }
          $version = $packages[0].version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match Cargo version $version."
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Fetch locked dependencies
        run: cargo fetch --locked --target $env:RUST_TARGET
      - name: Run offline unit tests
        run: cargo test --locked --offline --target $env:RUST_TARGET
      - name: Build release executable
        run: cargo build --release --locked --offline --target $env:RUST_TARGET
      - name: Save verified Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build Windows installer and portable package
        run: ./scripts/installer.ps1 -Target $env:RUST_TARGET -OutputDirectory dist -SkipBuild
      - name: Test silent installation, upgrade, and uninstall
        run: ./scripts/test-installer.ps1 -OutputDirectory dist
      - name: Test installed and portable application updates
        run: ./scripts/test-updater.ps1 -OutputDirectory dist
      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-test-logs-${{ github.ref_name }}
          path: dist/installer-test-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload updater test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-test-logs-${{ github.ref_name }}
          path: dist/updater-test-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare release notes
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $pattern = '(?ms)^##\s+\[?v?' + [regex]::Escape($version) + '\]?(?=\s|$)[^\r\n]*\r?\n(.*?)(?=^##\s|\z)'
          $section = [regex]::Match($changelog, $pattern)
          if (-not $section.Success) { throw "Missing CHANGELOG entry for $version." }
          $notes = @"
          **推荐下载安装版：``leigod-guard-$env:RELEASE_TAG-windows-x64-setup.exe``。** 双击后按安装向导操作，完成后可从桌面或开始菜单打开。

          适用于 Windows 10 / 11 x64。安装程序自动检查 Microsoft WebView2 Runtime；缺少时调用包内的微软官方安装器联网补齐。已有运行库时直接安装应用。登录雷神账号并添加需要监控的游戏后即可使用。安装版和便携版均为独立第三方工具，与雷神官方无隶属或背书关系。

          需要绿色免安装版时，下载 ``leigod-guard-$env:RELEASE_TAG-windows-x64.zip``，完整解压后打开 ``leigod-guard.exe``。每次发版同时提供安装版和绿色版；``SHA256SUMS.txt`` 包含两个包的 SHA-256 校验值。程序尚未代码签名，Windows 可能提示未知发布者。

          在“关于与更新”中可手动“检查更新”，也可选择开启“启动时自动检查更新”（默认关闭）。发现新版本后点击“下载并更新”，程序会校验下载文件、保留配置、完成更新并重新打开，安装版和绿色版各自保持原来的使用方式。v0.5.x 用户首次升级到本版需手动下载安装或解压新包。

          本版默认开启启动补暂停：在自动暂停开启、游戏名单有效且没有名单游戏运行时，启动后立即尝试暂停雷神计时。名单为空或启动时关闭相关开关则跳过；检测或网络失败时不会假定暂停成功。可在“策略”页关闭此选项。升级完成后重新打开应用，也会遵循这一启动策略。

          本工作流在 Windows Server 2022 上构建 ``$env:RUST_TARGET``，已通过代码格式、离线单元测试、release 编译、静态 CRT 依赖检查，以及静默安装、快捷方式、版本号、覆盖升级、卸载和配置保留检查。更新集成测试使用无账号操作的下一版本测试程序，验证真实更新辅助进程的等待退出、安装版升级、绿色版替换、配置保留和重新启动。未验证真实账户登录、验证码、实际暂停请求、关机行为或图形界面交互。使用方法、触发条件及限制见仓库 README。

          $($section.Groups[1].Value.Trim())
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/release-notes.md'), $notes, [System.Text.UTF8Encoding]::new($false))
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $zip = Join-Path $PWD "dist/leigod-guard-$env:RELEASE_TAG-windows-x64.zip"
          $setup = Join-Path $PWD "dist/leigod-guard-$env:RELEASE_TAG-windows-x64-setup.exe"
          $sums = Join-Path $PWD 'dist/SHA256SUMS.txt'
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG, $setup, $zip, $sums,
            '--verify-tag', '--draft', '--title', "Leigod Guard $env:RELEASE_TAG",
            '--notes-file', 'dist/release-notes.md'
          )
          # An existing release causes this to fail instead of silently replacing assets.
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. Inspect any existing release before retrying.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Assets uploaded, but publishing failed. The release remains a draft.' }
