name: Sync GitHub to Gitee

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish Windows release]
    types: [completed]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      scope:
        description: Release sync, refs only, or a full historical release audit
        type: choice
        options: [release, refs, all]
        default: release
      tag:
        description: Exact published tag for release scope; empty selects GitHub latest
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: gitee-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'CMMUU/leigod-guard' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted default-branch synchronizer
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false
      - name: Run offline synchronizer checks
        run: python3 -m unittest discover -s scripts -p 'test_sync_gitee.py'
      - name: Synchronize to the checked Gitee repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_ASSET_HOSTS: ${{ vars.GITEE_ASSET_HOSTS }}
          SYNC_SCOPE: ${{ github.event_name == 'push' && 'refs' || inputs.scope || 'release' }}
          SYNC_TAG: ${{ github.event.release.tag_name || (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_branch) || inputs.tag || '' }}
        run: >-
          python3 scripts/sync_gitee.py --repo leigod-guard
          --scope "$SYNC_SCOPE" --tag "$SYNC_TAG" --work-dir "$RUNNER_TEMP/gitee-sync" --apply
