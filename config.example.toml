# 雷神守护配置示例，不含个人账户数据。
# 实际配置：%APPDATA%\leigod-guard\config.toml
# 建议通过应用界面配置。手工修改前请先完全退出程序。

# 预留加速方案字段：当前版本不提供自动开启加速或恢复计时。
plans = []

[[games]]
name = "示例游戏"
# 填真实游戏进程的文件名（忽略大小写、完整匹配）；不是路径或通配符。
exe = "ExampleGame.exe"
# 当前版本保留字段，无需设置加速方案。
plan = ""

[strategy]
# 控制启动检查和正常游戏退出触发的自动暂停。
enabled = true
# 对应「启动时无游戏运行则暂停计时」；默认开启，旧配置缺少此字段时也为 true。
# 启动时名单非空、进程名全部有效且 enabled 为 true，连续等待结束仍无名单游戏时尝试暂停。
# 启动时名单为空、任一进程名无效或相关开关关闭会跳过该次启动检查；失败不视为成功。
pause_on_startup = true
# 启动检查单独等待 180 秒；旧配置缺少此字段也默认 180 秒。
# 首页或托盘可将尚未结束的启动检查延后至少 10 分钟，仅在本次运行内有效。
startup_grace_secs = 180
check_interval_secs = 3
# 正常游戏全部退出后的宽限期，与启动等待分开。
grace_secs = 90
# 预留字段，当前暂停策略不使用该值。
min_run_secs = 300
# 请从应用界面设置自启，以便同步注册表项。
autostart = false
# 独立于 enabled；需要系统通知、有效 token 和可用网络。
pause_on_shutdown = true
# 默认关闭。开启后，从托盘完全退出雷神守护并重新打开才会生效。
# 使用 Windows 进程加载限制保护本工具，不关闭游戏加加，也不修改游戏加加的配置。
# 严格模式也会阻止其他不属于 Microsoft、Microsoft Store 或 WHQL 信任范围的 DLL；若有兼容问题，请关闭后完全退出并重新打开。
block_gamepp_injection = false

[updates]
# 默认不在启动时联网检查更新；可在「关于与更新」页开启。
# 手动「检查更新」始终可用；只有点击「下载并更新」才会下载并安装。
check_on_startup = false
# github 或 gitee；检查版本、下载成品和校验文件均使用同一来源。
# 国内网络可改为 gitee，或在「关于与更新」中切换；旧配置默认 github。
source = "github"

[account]
# 账户名称明文存储；请通过应用登录，不要在示例中填入真实凭据。
username = ""
# Windows DPAPI 加密的密码 MD5；不要填写密码明文或直接填写 MD5。
cred_enc = ""
# Windows DPAPI 加密的 token；不要填写 token 明文。
token_enc = ""
